name: Render production asset reviews

on:
  workflow_dispatch:
  push:
    branches:
      - "Sana's-work"
    paths:
      - ".github/workflows/render-production-asset-reviews.yml"
      - "bakesmart_ai/tools/render_production_asset_reviews.py"
      - "bakesmart_ai/data/production_assets_v1/asset_manifest.csv"
      - "bakesmart_ai/app/assets/production/*.glb"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Sana's-work
        uses: actions/checkout@v4
        with:
          ref: "Sana's-work"

      - name: Install Blender and glTF dependency
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender --background --python-expr "import numpy; print('Blender NumPy', numpy.__version__)"

      - name: Render geometry-review assets
        working-directory: bakesmart_ai
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/production-asset-review-renders"
          blender -b \
            --python tools/render_production_asset_reviews.py \
            -- \
            --output-dir "$RUNNER_TEMP/production-asset-review-renders"
          test -s "$RUNNER_TEMP/production-asset-review-renders/prod-table-low-floral/front.png"
          test -s "$RUNNER_TEMP/production-asset-review-renders/prod-floor-marigold-clusters/front.png"
          test -s "$RUNNER_TEMP/production-asset-review-renders/prod-sign-mirror-welcome/front.png"

      - name: Upload review renders
        uses: actions/upload-artifact@v4
        with:
          name: production-asset-review-renders
          path: ${{ runner.temp }}/production-asset-review-renders
          if-no-files-found: error
          retention-days: 14
