name: Build professional CC0 asset candidates

on:
  workflow_dispatch:
  push:
    branches:
      - "Sana's-work"
    paths:
      - ".github/workflows/build-professional-assets.yml"
      - "bakesmart_ai/tools/collect_professional_assets.py"
      - "bakesmart_ai/tools/build_cc0_production_batch.py"
      - "bakesmart_ai/tools/build_cc0_production_batch_final.py"
      - "bakesmart_ai/tools/validate_production_candidates.py"
      - "bakesmart_ai/tools/promote_geometry_review.py"
      - "bakesmart_ai/tools/render_production_asset_reviews.py"
      - "bakesmart_ai/data/production_assets_v1/production_batch1_plan.csv"
      - "bakesmart_ai/data/professional_asset_sources_v1/source_manifest.csv"
      - "bakesmart_ai/data/professional_asset_sources_v1/source_manifest_batch2.csv"

permissions:
  contents: write

concurrency:
  group: professional-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Sana's-work
        uses: actions/checkout@v4
        with:
          ref: "Sana's-work"
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install "pydantic>=2,<3"

      - name: Install Blender and headless rendering dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb
          blender --version
          blender --background --python-expr "import numpy; print('Blender NumPy', numpy.__version__)"

      - name: Download vetted CC0 model bundles
        working-directory: bakesmart_ai
        run: |
          set -euxo pipefail
          python tools/collect_professional_assets.py --source-id ph-ceramic-vase-04 --download
          python tools/collect_professional_assets.py --source-id ph-shrub-sorrel-01 --download
          python tools/collect_professional_assets.py --source-id ph-brass-pot-01 --download
          python tools/collect_professional_assets.py --source-id ph-flower-empodium --download
          python tools/collect_professional_assets.py --source-id ph-flower-gazania --download
          python tools/collect_professional_assets.py --source-id ph-ornate-mirror-01 --download

      - name: Build true-size geometry-review GLBs
        working-directory: bakesmart_ai
        run: |
          set -euxo pipefail
          rm -f data/production_assets_v1/production_candidate_build_report.json
          blender --background --python tools/build_cc0_production_batch_final.py -- \
            --plan data/production_assets_v1/production_batch1_plan.csv \
            --report data/production_assets_v1/production_candidate_build_report.json
          test -s data/production_assets_v1/production_candidate_build_report.json
          test -s app/assets/production/table-low-floral.glb
          test -s app/assets/production/floor-marigold-clusters.glb
          test -s app/assets/production/sign-mirror-welcome.glb

      - name: Validate candidate GLBs
        working-directory: bakesmart_ai
        run: |
          set -euxo pipefail
          python tools/validate_production_candidates.py
          python tools/promote_geometry_review.py
          test -s data/production_assets_v1/production_candidate_validation_report.json

      - name: Render geometry-review assets for QA
        working-directory: bakesmart_ai
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/production-asset-review-renders"
          xvfb-run -a -s "-screen 0 1920x1080x24" blender -b \
            --python tools/render_production_asset_reviews.py \
            -- \
            --output-dir "$RUNNER_TEMP/production-asset-review-renders"
          test -s "$RUNNER_TEMP/production-asset-review-renders/prod-table-low-floral/front.png"
          test -s "$RUNNER_TEMP/production-asset-review-renders/prod-floor-marigold-clusters/front.png"
          test -s "$RUNNER_TEMP/production-asset-review-renders/prod-sign-mirror-welcome/front.png"

      - name: Upload QA renders
        uses: actions/upload-artifact@v4
        with:
          name: production-asset-review-renders
          path: ${{ runner.temp }}/production-asset-review-renders
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated review candidates to Sana's-work only
        run: |
          set -euxo pipefail
          git config user.name "BakeSmart Asset Builder"
          git config user.email "bakesmart-asset-builder@users.noreply.github.com"
          git add \
            bakesmart_ai/app/assets/production/table-low-floral.glb \
            bakesmart_ai/app/assets/production/floor-marigold-clusters.glb \
            bakesmart_ai/app/assets/production/sign-mirror-welcome.glb \
            bakesmart_ai/data/production_assets_v1/asset_manifest.csv \
            bakesmart_ai/data/production_assets_v1/production_candidate_build_report.json \
            bakesmart_ai/data/production_assets_v1/production_candidate_validation_report.json
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git commit -m "Build first CC0 production asset candidates"
          git push origin HEAD:"Sana's-work"
